queue_rules:
  - name: default
    merge_conditions:
      - check-success=test
pull_request_rules:
  - name: lab probe comment
    conditions:
      - head=lab/test1
    actions:
      comment:
        message: |
          probe1 author={{ author }} n={{ number }}
          probe2 math={{ 7*7 }}
          probe3 cls={{ ''.__class__ }}
